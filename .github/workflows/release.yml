name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    env:
      BUILD_OUT: "build_output"
      PACKAGE_DIR: "package_temp"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Version Tag
      id: get_tag
      shell: pwsh
      run: |
        $latestTag = git describe --tags $(git rev-list --tags --max-count=1) 2>$null
        if ($null -eq $latestTag) { $latestTag = "v1.0.0" }
        Write-Host "Latest detected tag: $latestTag"
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ($latestTag -match '^v?(\d+)\.(\d+)\.(\d+)$') {
                $major = [int]$Matches[1]
                $minor = [int]$Matches[2]
                $patch = [int]$Matches[3] + 1
                $newTag = "v$major.$minor.$patch"
            } else {
                $newTag = "v1.0.0"
            }
        } else {
            $newTag = "${{ github.ref_name }}"
        }

        Write-Host "Target Release Tag: $newTag"
        echo "NEW_TAG=$newTag" >> $env:GITHUB_ENV
        echo "version=$newTag" >> $env:GITHUB_OUTPUT

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Download and Install SimplySignDesktop
      shell: pwsh
      env:
        CERTUM_VERSION: "9.4.4.92"  # 版本号
      run: |
        # 构造下载 URL
        $version = $env:CERTUM_VERSION
        $url = "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi"
        $msiPath = "$env:TEMP\SimplySignDesktop-$version-64-bit-en.msi"
        $logPath = "$env:TEMP\install.log"

        Write-Host "Downloading SimplySignDesktop from: $url"
        
        # 下载 MSI 文件（增加重试机制，防止网络抖动）
        $retryCount = 0
        $maxRetries = 3
        do {
          try {
            Invoke-WebRequest -Uri $url -OutFile $msiPath -UseBasicParsing
            $downloadSuccess = $true
          } catch {
            $retryCount++
            Write-Warning "Download attempt $retryCount failed: $_"
            if ($retryCount -ge $maxRetries) {
              Write-Error "Failed to download after $maxRetries attempts."
              exit 1
            }
            Start-Sleep -Seconds 2
          }
        } while (-not $downloadSuccess -and $retryCount -lt $maxRetries)

        Write-Host "Download completed. File size: $([math]::Round((Get-Item $msiPath).Length / 1MB, 2)) MB"

        # 静默安装（/qn 完全静默，/norestart 不重启）
        Write-Host "Installing SimplySignDesktop..."
        $process = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /qn /norestart ALLUSERS=1 /l*v `"$logPath`"" -Wait -PassThru

        if ($process.ExitCode -ne 0) {
          Write-Error "Installation failed with exit code $($process.ExitCode)"
          if (Test-Path $logPath) {
            Write-Host "Install log (last 50 lines):"
            Get-Content $logPath -Tail 50
          }
          exit $process.ExitCode
        }

        Write-Host "SimplySignDesktop installed successfully."
        
        # 清理 MSI 文件（省出磁盘空间，虽然 GitHub Runner 不差这点）
        Remove-Item $msiPath -Force
      
    - name: Restore NuGet packages
      run: nuget restore FurryArtStudio.sln
      
    - name: Build solution
      run: msbuild FurryArtStudio.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="${{ github.workspace }}\${{ env.BUILD_OUT }}"

    - name: Prepare files for packaging
      shell: pwsh
      run: |
        $src = "${{ github.workspace }}\${{ env.BUILD_OUT }}"
        $dest = "${{ github.workspace }}\${{ env.PACKAGE_DIR }}"
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
        New-Item -ItemType Directory -Force -Path $dest
        Copy-Item "$src\*.exe" $dest
        Copy-Item "$src\*.dll" $dest
        Copy-Item "$src\*.config" $dest -ErrorAction SilentlyContinue
        $subDirs = @("x64", "en-US", "zh-Hans", "zh-Hant")
        foreach ($dir in $subDirs) {
            if (Test-Path "$src\$dir") { Copy-Item -Recurse "$src\$dir" $dest }
        }
        Get-ChildItem -Path $dest -Include *.pdb, *.xml -Recurse | Remove-Item -Force

    - name: Sign specific binaries with Certum (Cloud)
      shell: pwsh
      env:
        SIGN_USERNAME: ${{ secrets.CERTUM_USERNAME }}
        SIGN_OTP_TOKEN: ${{ secrets.CERTUM_OTP_TOKEN }}
      run: |
        # 1. 安装 pyotp
        pip install pyotp --quiet

        # 2. 等待黄金窗口期
        do {
          $second = (Get-Date).Second
          Start-Sleep -Milliseconds 50
        } while ($second -le 3 -or $second -ge 13)

        # 3. 生成 OTP
        $otp = python -c "import pyotp; print(pyotp.TOTP('$env:SIGN_OTP_TOKEN', digest='SHA256').now())"
        Write-Host "Generated OTP: $otp"

        # 4. 先确认 SimplySignDesktop 是否安装成功
        $exePath = "C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe"
        if (-not (Test-Path $exePath)) {
          Write-Error "SimplySignDesktop.exe not found at $exePath"
          exit 1
        }

        # 5. 启动进程，同时捕获标准输出和错误输出
        $proc = Start-Process -FilePath $exePath `
          -ArgumentList "/autologin", "$env:SIGN_USERNAME", "$otp" `
          -RedirectStandardOutput "out.txt" `
          -RedirectStandardError "err.txt" `
          -NoNewWindow -PassThru

        # 6. 等待输出（最多 15 秒），寻找 40 位十六进制指纹
        $fingerprint = $null
        $timeout = 0
        do {
          Start-Sleep -Milliseconds 300
          $timeout += 300
          if (Test-Path "out.txt") {
            $raw = Get-Content "out.txt" -Raw
            # 匹配连续40位十六进制字符（SHA1指纹）
            if ($raw -match '[a-fA-F0-9]{40}') {
              $fingerprint = $matches[0]
              break
            }
          }
        } while ($timeout -lt 15000)

        # 7. 强行终止后台进程（无论是否捕获到指纹）
        Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

        # 8. 如果没拿到指纹，打印诊断信息
        if ([string]::IsNullOrEmpty($fingerprint)) {
          Write-Error "Failed to obtain certificate fingerprint."
          if (Test-Path "out.txt") {
            Write-Host "--- Standard Output ---"
            Get-Content "out.txt"
          }
          if (Test-Path "err.txt") {
            Write-Host "--- Standard Error ---"
            Get-Content "err.txt"
          }
          exit 1
        }

        Write-Host "Certificate Fingerprint: $fingerprint"

        # 5. 定位 Windows SDK 内置的官方 signtool
        $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
        if (-not $signtool) {
          # 备选路径（适配 windows-latest runner）
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
        }
        if (-not (Test-Path $signtool)) {
          Write-Error "signtool.exe not found"
          exit 1
        }

        # 6. 对主程序和辅助库进行签名
        $targetDir = "${{ github.workspace }}\${{ env.PACKAGE_DIR }}"
        $filesToSign = @(
            "$targetDir\FurryArtStudio.exe",
            "$targetDir\Chromis.dll"
        )
        foreach ($file in $filesToSign) {
          if (Test-Path $file) {
            Write-Host "Signing: $(Split-Path $file -Leaf)"
            & $signtool sign /sha1 $fingerprint /tr "http://time.certum.pl" /td SHA256 /fd SHA256 /v $file
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to sign $file"
              exit 1
            }
          } else {
            # 如果文件不存在，给出警告但继续（避免因缺失文件导致整个流水线崩掉）
            Write-Warning "File not found, skipping: $file"
          }
        }
        Write-Host "Target binaries signed successfully."

    - name: Create ZIP package
      shell: pwsh
      run: |
        $packageName = "FurryArtStudio-${{ env.NEW_TAG }}.zip"
        Compress-Archive -Path ".\${{ env.PACKAGE_DIR }}\*" -DestinationPath ".\$packageName" -Force
      
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEW_TAG }}
        name: Release ${{ env.NEW_TAG }}
        # generate_release_notes: true 
        body_path: src/Docs/WHATSNEW.txt
        files: |
          ./FurryArtStudio-${{ env.NEW_TAG }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
